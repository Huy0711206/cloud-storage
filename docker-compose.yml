# CloudBox native: application + persistent PostgreSQL and file storage
# Chạy:  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nextcloud
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infrastructure/docker/db-init:/docker-entrypoint-initdb.d:ro   # tạo thêm database "portal"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d nextcloud"]
      interval: 5s
      timeout: 5s
      retries: 20

  portal:
    image: cloud-storage-portal:native
    build: ./apps/portal
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"  # cổng chính trên laptop
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 12
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/portal
      SECRET_KEY: ${SECRET_KEY}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_DELIVERY_MODE: production
      STORAGE_ROOT: /data/cloudbox
      STORAGE_POOL_LIMIT_BYTES: ${STORAGE_POOL_LIMIT_BYTES:-21474836480}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL}
    volumes:
      - cloudbox_data:/data/cloudbox


volumes:
  cloudbox_data:
    external: true
    name: cloud-storage_cloudbox_data
  db_data:
  nextcloud_data:
  mailpit_data:
    external: true
    name: cloud-storage_mailpit_data
