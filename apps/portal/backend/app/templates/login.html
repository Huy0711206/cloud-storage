{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="narrow card">
  <h2>Đăng nhập</h2>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Email
      <input type="email" name="email" value="{{ form.get('email', '') }}" required autocomplete="email">
    </label>
    <label>Mật khẩu
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn" type="submit">Đăng nhập</button>
  </form>
  {% if unverified %}
  <form method="post" action="/resend" class="form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="email" value="{{ form.get('email', '') }}">
    <button class="btn ghost" type="submit">Gửi lại email xác thực</button>
  </form>
  {% endif %}
  <p class="muted">Chưa có tài khoản? <a href="/register">Đăng ký</a></p>
</div>
{% endblock %}
