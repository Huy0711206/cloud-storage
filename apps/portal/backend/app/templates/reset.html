{% extends "base.html" %}{% block title %}Đặt lại mật khẩu{% endblock %}
{% block content %}<section class="narrow card"><h1>Đặt lại mật khẩu CloudBox</h1>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form action="/reset-password" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="token" value="{{ reset_token }}"><label>Mật khẩu mới<input type="password" name="password" autocomplete="new-password" minlength="10" required></label><label>Nhập lại mật khẩu<input type="password" name="password2" autocomplete="new-password" required></label><button type="submit">Đặt lại mật khẩu</button></form><a href="/forgot-password">Yêu cầu liên kết mới</a></section>{% endblock %}
