name: cloud-storage
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: ./private/db.env
        format: raw
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d portal']
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      options:
        max-size: 10m
        max-file: '3'
  portal:
    image: cloud-storage-portal:native
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./private/portal.env
        format: raw
    ports:
      - '127.0.0.1:8000:8000'
    command: [uvicorn, 'app.main:app', --host, '0.0.0.0', --port, '8000', --proxy-headers, --forwarded-allow-ips, '*', --no-access-log]
    volumes:
      - cloudbox_data:/data/cloudbox
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 12
    logging:
      options:
        max-size: 10m
        max-file: '3'
volumes:
  db_data:
    external: true
    name: cloud-storage_db_data
  cloudbox_data:
    external: true
    name: cloud-storage_cloudbox_data
